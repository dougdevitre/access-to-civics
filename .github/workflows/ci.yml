name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate demo bundle and verify it is committed
        run: |
          npm run bundle:demo
          git diff --exit-code -- public/bundles
      - run: npm run typecheck
      - run: npm test
      - run: npm run gates
      - run: npm run build
