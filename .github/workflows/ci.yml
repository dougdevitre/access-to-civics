name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate demo bundle and verify it is committed
        run: |
          npm run bundle:demo
          git diff --exit-code -- public/bundles
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Content and privacy gates (reading level, sensitivity, clause refs, privacy regression)
        run: npm run gates
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end + accessibility (axe) suite
        run: npm run test:a11y
