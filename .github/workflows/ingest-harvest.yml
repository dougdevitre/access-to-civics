name: Ingest harvest

# Manual trigger: fetches the targeted constitution pages for one state from its official site
# (GitHub runners have open egress; the dev sandbox does not) and commits the raw bytes
# to the ingest/<state>-raw branch as the L0 provenance layer. Extraction happens offline
# against those committed bytes.
on:
  workflow_dispatch:
    inputs:
      state:
        description: Two-letter state code to harvest
        required: true
        default: mo
        type: choice
        options: [mo, tx]

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The harvest script imports @playwright/test for states that render client-side, so the
      # repo's own dependencies have to be present — npx alone installs a CLI, not node_modules.
      - run: npm ci
      # Only states that render their constitution client-side need this, and none currently
      # do. --with-deps shells out to apt and has wedged on a runner, so it is bounded and
      # non-fatal; a state that truly needs a browser will fail loudly in the harvest step.
      - name: Install browser (best effort; only rendered-DOM states need it)
        run: npx playwright install chromium
        continue-on-error: true
        timeout-minutes: 5
      - run: node scripts/harvest-${{ inputs.state }}.mjs
      - name: Upload raw pages as artifact (debugging aid, kept even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.state }}-raw
          path: data/raw/${{ inputs.state }}
      - name: Commit harvest to ingest/<state>-raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ingest/${{ inputs.state }}-raw
          git add -f data/raw/${{ inputs.state }}
          git commit -m "Harvest ${{ inputs.state }} constitution raw pages (L0 provenance)"
          git push -f origin ingest/${{ inputs.state }}-raw
