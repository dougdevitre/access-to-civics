name: Ingest probe

# Diagnostics for a state whose official site we have not figured out yet. Writes nothing and
# commits nothing — the log is the whole output. Separate from the harvest workflow on purpose:
# a probe should never be able to touch an ingest/<state>-raw branch.
on:
  workflow_dispatch:
    inputs:
      state:
        description: Two-letter state code to probe
        required: true
        default: tx
        type: choice
        options: [tx, ne, de, ca, nh, fl]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The probe only needs a browser when no candidate URL returns the document, and
      # scripts/lib/probe.mjs already degrades gracefully when the import fails. So this must
      # never be able to gate the probe: --with-deps shells out to apt and has wedged for
      # 40+ minutes on a runner, which cost a whole diagnostic round trip.
      - name: Install browser (best effort; the probe runs without it)
        run: npx playwright install chromium
        continue-on-error: true
        timeout-minutes: 5
      - run: node scripts/probe-${{ inputs.state }}.mjs
