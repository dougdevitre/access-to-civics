<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Charter">
  <!--
    Ledger paper with a wax seal pressed into it.

    Redrawn for a maskable safe zone: Android adaptive icons crop to a circle of radius 40% about
    the centre, and the previous seal sat at (380, 392) — inside the corner that gets cut. Every
    mark here stays within the central 320px, so the icon survives a circle, a squircle and a
    rounded square without losing the thing that identifies it.
  -->
  <rect width="512" height="512" fill="#EDE8DC"/>
  <g fill="none" stroke="#1B1E24" stroke-width="20" stroke-linecap="round">
    <line x1="128" y1="168" x2="384" y2="168"/>
    <line x1="128" y1="228" x2="384" y2="228"/>
    <line x1="128" y1="288" x2="316" y2="288"/>
  </g>
  <g transform="translate(256 358)">
    <circle r="72" fill="#9B2226"/>
    <circle r="55" fill="none" stroke="#EDE8DC" stroke-width="4" opacity=".55"/>
    <path d="M0-44 11.6-19.4 38.4-15.5 19.2 3.2 23.7 30 0 17 -23.7 30 -19.2 3.2 -38.4-15.5 -11.6-19.4Z"
          fill="#EDE8DC" opacity=".82"/>
  </g>
</svg>
